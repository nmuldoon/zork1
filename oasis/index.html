<title>OASIS Avatar Forge</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Audiowide&family=Chakra+Petch:wght@400;500;600;700&family=VT323&display=swap">
<style>
/* Layout: a sticky "rig" preview (live avatar + stats) beside a tabbed configuration console.
   Single dark look by choice: you're inside the visor. */
:root {
  --void: #0f0c22;
  --panel: #19153a;
  --panel-2: #221d4a;
  --line: #352e66;
  --ink: #ece9ff;
  --muted: #9d96cc;
  --gold: #ffc94a;      /* the egg hunter's accent: copper/jade/crystal key gold */
  --cyan: #59e3ff;
  --danger: #ff6f91;
  --ok: #7cf2a6;
  --display: "Audiowide", "Arial Black", system-ui, sans-serif;
  --body: "Chakra Petch", "Segoe UI", system-ui, sans-serif;
  --data: "VT323", ui-monospace, "Courier New", monospace;
  --r: 10px;
  color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { min-height: 100%; }
body {
  background: radial-gradient(1200px 600px at 70% -10%, #2a1f63 0%, transparent 60%), var(--void);
  color: var(--ink); font: 16px/1.5 var(--body);
  padding-inline: 16px; padding-block: 20px 40px;
}
.wrap { max-width: 1240px; margin: 0 auto; display: flex; flex-direction: column; gap: 20px; }

header.top { display: flex; flex-wrap: wrap; align-items: end; justify-content: space-between; gap: 12px; }
.brand h1 { font: 400 clamp(26px, 4vw, 40px)/1.05 var(--display); margin: 0; letter-spacing: .04em; text-wrap: balance; }
.brand h1 span { color: var(--gold); }
.brand p { margin: 4px 0 0; color: var(--muted); font-size: 14px; }
.top-actions { display: flex; flex-wrap: wrap; gap: 8px; }

button { font: inherit; color: inherit; cursor: pointer; }
.btn {
  background: var(--panel-2); border: 1px solid var(--line); border-radius: 8px;
  padding: 8px 14px; font-weight: 600; letter-spacing: .02em;
}
.btn:hover { border-color: var(--cyan); }
.btn.primary { background: var(--gold); color: #1d1500; border-color: var(--gold); }
.btn.primary:hover { filter: brightness(1.08); }
:focus-visible { outline: 2px solid var(--cyan); outline-offset: 2px; }

.layout { display: grid; grid-template-columns: minmax(0, 380px) minmax(0, 1fr); gap: 20px; align-items: start; }

/* ---------- rig (preview) ---------- */
.rig {
  position: sticky; top: calc(env(safe-area-inset-top, 0px) + 12px);
  background: var(--panel); border: 1px solid var(--line); border-radius: var(--r);
  padding: 16px; display: flex; flex-direction: column; gap: 12px;
}
.rig-head { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: baseline; gap: 2px 8px; }
.rig-name { font: 400 22px/1.1 var(--display); margin: 0; overflow-wrap: anywhere; }
.rig-id { font: 20px/1 var(--data); color: var(--cyan); white-space: nowrap; }
.rig-sub { color: var(--muted); font-size: 14px; margin-top: -6px; }
.stage { position: relative; width: 100%; max-width: 100%; aspect-ratio: 3 / 4; border-radius: 8px; overflow: hidden; background: #120e2a; cursor: grab; }
.stage:active { cursor: grabbing; }
.stage canvas { display: block; }
.stage-hint { position: absolute; left: 10px; bottom: 8px; font: 18px/1 var(--data); color: var(--muted); pointer-events: none; }
.stage-msg { padding: 16px; color: var(--muted); font-size: 14px; }
.legend-tag { font: 18px/1 var(--data); color: var(--gold); }
.owner-row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.owner-row input { flex: 1 1 180px; }
.note.ok { color: var(--ok); }
.rainbow-grad, .btn.rainbow { background: linear-gradient(90deg, #ff3b3b, #ff9f43, #ffd23f, #3ecf8e, #3a8bff, #a77bff); }
.btn.rainbow { color: #0a0a0a; border-color: transparent; }
.bag { border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; display: flex; flex-direction: column; gap: 8px; background: var(--panel-2); }
.bag.rainbow { background: #0a0a0c; border: 2px solid transparent; background-image: linear-gradient(#0a0a0c, #0a0a0c), linear-gradient(90deg, #ff3b3b, #ff9f43, #ffd23f, #3ecf8e, #3a8bff, #a77bff); background-origin: border-box; background-clip: padding-box, border-box; }
.bag-title { font: 400 15px/1.2 var(--display); letter-spacing: .04em; }
.bag.rainbow .bag-title { background: linear-gradient(90deg, #ff3b3b, #ff9f43, #ffd23f, #3ecf8e, #3a8bff, #a77bff); -webkit-background-clip: text; background-clip: text; color: transparent; }
.bag-items { display: flex; flex-wrap: wrap; gap: 8px; }
.bag-item { display: flex; align-items: center; gap: 8px; padding: 6px 10px; border-radius: 8px; border: 1px solid var(--line); background: rgba(255,255,255,.03); font-size: 14px; color: var(--ink); text-align: left; }
.bag-item b { font-weight: 700; font-variant-numeric: tabular-nums; }
.bag-item.book:hover { border-color: var(--gold); }
.gem { width: 14px; height: 14px; transform: rotate(45deg); border-radius: 3px; background: conic-gradient(#ff3b3b, #ff9f43, #ffd23f, #3ecf8e, #3a8bff, #a77bff, #ff3b3b); box-shadow: 0 0 8px rgba(167,123,255,.6); flex: none; }
.book-ico { width: 14px; height: 18px; border-radius: 2px 4px 4px 2px; background: var(--gold); box-shadow: inset 3px 0 0 rgba(0,0,0,.35); flex: none; }
.bag.rainbow .book-ico { background: linear-gradient(180deg, #ff3b3b, #ffd23f, #3ecf8e, #3a8bff, #a77bff); }
dialog.lore { --book: var(--gold); width: min(860px, calc(100% - 32px)); max-height: calc(100% - 48px); overflow: auto; background: var(--panel); color: var(--ink); border: 2px solid var(--book); border-radius: 14px; padding: 20px; }
dialog.lore::backdrop { background: rgba(5, 3, 15, .7); }
dialog.lore.rainbow { background: #0a0a0c; border: 3px solid transparent; background-image: linear-gradient(#0a0a0c, #0a0a0c), linear-gradient(135deg, #ff3b3b, #ff9f43, #ffd23f, #3ecf8e, #3a8bff, #a77bff); background-origin: border-box; background-clip: padding-box, border-box; }
.lore-head { display: flex; justify-content: space-between; gap: 12px; align-items: start; border-bottom: 1px solid var(--line); padding-bottom: 12px; }
.lore-kicker { font-size: 11px; font-weight: 700; letter-spacing: .14em; text-transform: uppercase; color: var(--book); }
dialog.lore.rainbow .lore-kicker, dialog.lore.rainbow h2 { background: linear-gradient(90deg, #ff3b3b, #ff9f43, #ffd23f, #3ecf8e, #3a8bff, #a77bff); -webkit-background-clip: text; background-clip: text; color: transparent; }
.lore h2 { font: 400 26px/1.15 var(--display); margin: 4px 0; overflow-wrap: anywhere; }
.lore-sub { color: var(--muted); font-size: 14px; }
.lore-pages { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 24px; padding-top: 14px; }
.lore h3 { font-size: 12px; font-weight: 700; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); margin: 14px 0 6px; }
.lore section > h3:first-child { margin-top: 0; }
.lore p { margin: 0; font-size: 14px; }
.ach { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 6px; }
.ach li { display: flex; flex-direction: column; padding: 6px 10px; border-radius: 8px; background: rgba(255,255,255,.03); color: var(--muted); }
.ach li.ok { color: var(--ink); }
.ach li.ok b { color: var(--gold); }
.ach small { font-size: 12px; color: var(--muted); }
@media (max-width: 640px) { .lore-pages { grid-template-columns: 1fr; } }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { font-size: 12px; font-weight: 600; text-transform: uppercase; letter-spacing: .08em; padding: 3px 8px; border-radius: 999px; border: 1px solid var(--line); color: var(--muted); }
input::placeholder { color: var(--muted); font-weight: 500; }
.chip.legend { color: #1d1500; background: var(--gold); border-color: var(--gold); }
.chip.item { color: var(--cyan); border-color: color-mix(in srgb, var(--cyan) 45%, transparent); }
.chip.power { color: var(--gold); border-color: color-mix(in srgb, var(--gold) 50%, transparent); }
.stats { display: grid; grid-template-columns: auto 1fr auto; gap: 4px 10px; align-items: center; font: 20px/1 var(--data); }
.stats .lbl { color: var(--muted); letter-spacing: .05em; }
.bar { height: 8px; background: var(--void); border-radius: 4px; overflow: hidden; }
.bar i { display: block; height: 100%; background: linear-gradient(90deg, var(--cyan), var(--gold)); transition: width .25s; }
.stats .num { font-variant-numeric: tabular-nums; text-align: right; min-width: 2ch; }
.vitals { display: flex; gap: 16px; font: 20px/1 var(--data); color: var(--muted); }
.vitals b { color: var(--ink); font-weight: 400; }

/* ---------- console ---------- */
.console { background: var(--panel); border: 1px solid var(--line); border-radius: var(--r); min-width: 0; }
.tabs { display: flex; gap: 2px; overflow-x: auto; border-bottom: 1px solid var(--line); padding: 6px 6px 0; scrollbar-width: thin; }
.tab {
  background: none; border: none; border-bottom: 2px solid transparent;
  padding: 10px 12px; white-space: nowrap; color: var(--muted); font-weight: 600; font-size: 14px;
  display: flex; align-items: center; gap: 6px;
}
.tab .n { font: 18px/1 var(--data); color: var(--line); }
.tab[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--gold); }
.tab[aria-selected="true"] .n { color: var(--gold); }
.tab .done { width: 6px; height: 6px; border-radius: 50%; background: var(--ok); }
.pane { padding: 20px; display: flex; flex-direction: column; gap: 22px; }
.pane h2 { font: 400 20px/1.2 var(--display); margin: 0; letter-spacing: .03em; }
.pane .lead { margin: -14px 0 0; color: var(--muted); font-size: 14px; max-width: 65ch; }

.field { display: flex; flex-direction: column; gap: 8px; }
.field > .label { font-size: 12px; font-weight: 700; text-transform: uppercase; letter-spacing: .12em; color: var(--muted); display: flex; justify-content: space-between; gap: 8px; }
.field > .label output, .field > .label .hint { font: 20px/1 var(--data); letter-spacing: 0; text-transform: none; color: var(--cyan); }
.row2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 18px; }

input[type="text"], input[type="password"] {
  background: var(--void); border: 1px solid var(--line); border-radius: 8px; color: var(--ink);
  font: 600 18px var(--body); padding: 10px 12px; width: 100%;
}
input[type="text"]:focus, input[type="password"]:focus { border-color: var(--cyan); outline: none; }
input[type="range"] { width: 100%; accent-color: var(--gold); }

.choices { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 8px; }
.choices.cols4 { grid-template-columns: repeat(4, minmax(0, 1fr)); }
.choices.small { grid-template-columns: repeat(auto-fill, minmax(110px, 1fr)); }
.opt {
  text-align: left; background: var(--panel-2); border: 1px solid var(--line); border-radius: 8px;
  padding: 10px 12px; display: flex; flex-direction: column; gap: 2px; min-width: 0;
}
.opt b { font-weight: 600; font-size: 15px; }
.opt small { color: var(--muted); font-size: 12px; line-height: 1.35; }
.opt:hover:not(:disabled) { border-color: var(--cyan); }
.opt[aria-pressed="true"] { border-color: var(--gold); background: color-mix(in srgb, var(--gold) 14%, var(--panel-2)); }
.opt[aria-pressed="true"] b { color: var(--gold); }
.opt:disabled { opacity: .4; cursor: not-allowed; }

.swatches { display: flex; flex-wrap: wrap; gap: 8px; }
.sw { width: 36px; height: 36px; border-radius: 50%; border: 2px solid var(--line); padding: 0; position: relative; }
.sw[aria-pressed="true"] { border-color: var(--gold); box-shadow: 0 0 0 3px color-mix(in srgb, var(--gold) 35%, transparent); }
.sw:hover { border-color: var(--cyan); }

.counter { font: 22px/1 var(--data); color: var(--gold); }
.note { font-size: 13px; color: var(--muted); }
.note.warn { color: var(--danger); }

/* ---------- review / ID card ---------- */
.idcard { display: grid; grid-template-columns: 140px minmax(0, 1fr); gap: 18px; background: linear-gradient(135deg, var(--panel-2), var(--void)); border: 1px solid var(--gold); border-radius: 12px; padding: 18px; }
.idcard img { width: 100%; max-width: 100%; border-radius: 6px; background: #0a0819; }
.idcard h3 { font: 400 24px/1.1 var(--display); margin: 0; overflow-wrap: anywhere; }
.idcard .kv { display: grid; grid-template-columns: max-content minmax(0, 1fr); gap: 4px 14px; margin-top: 10px; font-size: 14px; }
.idcard .kv dt { color: var(--muted); text-transform: uppercase; letter-spacing: .08em; font-size: 11px; padding-top: 3px; }
.idcard .kv dd { margin: 0; overflow-wrap: anywhere; }
.keys { display: flex; gap: 12px; font: 20px/1 var(--data); color: var(--muted); margin-top: 10px; flex-wrap: wrap; }
.keys span::before { content: "○ "; }
.pane-nav { display: flex; justify-content: space-between; gap: 8px; border-top: 1px solid var(--line); padding-top: 16px; }
.toast { position: fixed; left: 50%; bottom: calc(env(safe-area-inset-bottom, 0px) + 20px); transform: translateX(-50%); background: var(--gold); color: #1d1500; padding: 8px 16px; border-radius: 8px; font-weight: 700; }
textarea#sheet { width: 100%; min-height: 160px; background: var(--void); color: var(--ink); border: 1px solid var(--line); border-radius: 8px; font: 18px/1.2 var(--data); padding: 10px; }
.foot { color: var(--muted); font-size: 12px; text-align: center; }

@media (max-width: 640px) { .choices.cols4 { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
@media (max-width: 860px) {
  .layout { grid-template-columns: 1fr; }
  .rig { position: static; display: grid; grid-template-columns: minmax(0, 150px) minmax(0, 1fr); align-items: start; }
  .rig > .stage { grid-row: span 6; }
  .rig-head, .rig-sub, .chips, .stats, .vitals, .bag { grid-column: 2; }
  .row2 { grid-template-columns: 1fr; }
}
@media (max-width: 480px) {
  .rig { grid-template-columns: minmax(0, 110px) minmax(0, 1fr); }
  .idcard { grid-template-columns: 1fr; }
  .idcard img { max-width: 160px; }
}
@media (prefers-reduced-motion: reduce) { .bar i { transition: none; } }
</style>

<div class="wrap">
  <header class="top">
    <div class="brand">
      <h1>OASIS <span>Avatar Forge</span></h1>
      <p>Build the avatar you'll log in as. Fan-made, inspired by <i>Ready Player One</i>.</p>
    </div>
    <div class="top-actions">
      <button class="btn" id="randomize" type="button">Randomize</button>
      <button class="btn" id="reset" type="button">Start over</button>
    </div>
  </header>

  <div class="layout">
    <aside class="rig" aria-label="Avatar preview">
      <div class="stage" id="stage"><span class="stage-hint">Drag to spin</span></div>
      <div class="rig-head">
        <h2 class="rig-name" id="rig-name">Enter gamer name</h2>
        <span class="rig-id" id="rig-id">LVL 1</span>
      </div>
      <div class="rig-sub" id="rig-sub"></div>
      <div class="chips" id="rig-chips"></div>
      <div class="stats" id="rig-stats"></div>
      <div class="vitals" id="rig-vitals"></div>
      <div class="bag" id="bag"></div>
    </aside>

    <section class="console">
      <div class="tabs" role="tablist" id="tabs"></div>
      <div class="pane" id="pane" role="tabpanel"></div>
    </section>
  </div>
  <p class="foot">Unofficial fan project. Your avatar is saved in this browser only.</p>
</div>
<div class="toast" id="toast" hidden></div>
<dialog class="lore" id="lore" aria-labelledby="lore-title"></dialog>

<script src="https://cdn.jsdelivr.net/npm/three@0.149.0/build/three.min.js"></script>

  }
  if (o.bottoms === 'Skirt') add(body, cyl(hipR * 1.0, hipR * 1.6, legLen * 0.45, 28, true), std(botC, { side: T.DoubleSide }), [0, hipY - legLen * 0.2, 0], [0, 0, 0], [1, 1, 0.8]);

    add(body, box(torsoLen * 0.8, 0.02, 0.005), rainbowM(T.FrontSide, 1), [0, torsoY + torsoLen * 0.5, waistR * 0.74], [0, 0, Math.PI / 2]);
  }
  if (o.outer === 'Rainbow Cloak') {
    const capeLen = torsoLen * 0.9 + legLen * 0.92;

    add(body, cyl(shoulderR * 2.0, shoulderR * 2.02, 0.03, 32, true, Math.PI - 1.9, 3.8), rainbowM(T.DoubleSide, 6), [0, yC - capeLen / 2, -0.01], [0, 0, 0], [1, 1, 0.82]);
    // shoulder mantle with rainbow edge, and hood behind the head
    add(body, cyl(shoulderR * 0.75, shoulderR * 1.32, 0.16, 32, true), black({ side: T.DoubleSide }), [0, torsoY + torsoLen * 0.9, 0], [0, 0, 0], [1, 1, 0.8]);
    add(body, cyl(shoulderR * 1.32, shoulderR * 1.34, 0.025, 32, true), rainbowM(T.DoubleSide, 6), [0, torsoY + torsoLen * 0.9 - 0.08, 0], [0, 0, 0], [1, 1, 0.8]);
    add(body, sph(headR * 1.25, 24, 16, Math.PI, Math.PI, 0, Math.PI * 0.75), black({ side: T.DoubleSide }), [0, torsoY + torsoLen + headR * 0.75, -0.035]);
    R3.anim.push(t => { const r = Math.sin(t / 900) * 0.035 - 0.03; outer.rotation.x = r; inner.rotation.x = r; });

  // ---- robe / coats / cape (over torso) ----

  const coat = ['Leather jacket', 'Trench coat', 'Bomber', 'Lab coat'].includes(o.outer);
  const coatC = o.outer === 'Lab coat' ? '#f4f4f6' : outC;

    if (o.outer === 'Bomber') add(body, tor(hipR * 1.05, 0.02), std(shade(coatC, -0.3)), [0, torsoY + 0.02, 0], [Math.PI / 2, 0, 0], [1, 0.74, 1]);

      [0, torsoY + torsoLen * 0.92 - capeLen / 2, -0.02], [0, 0, 0], [1, 1, 0.8]);

  if (o.top === 'Hoodie') {

    for (const sx of [-1, 1]) add(body, cyl(0.005, 0.005, 0.12), std('#f4f4f6'), [sx * 0.03, torsoY + torsoLen * 0.82, chestR * 0.72]);

  if (o.top === 'Armor plate') {

  if (o.top === 'Tux shirt') {

  const sleeveFull = coat ? std(coatC) : o.top === 'Rainbow Tunic' ? black() : ['Hoodie', 'Robe'].includes(o.top) ? std(topC) : o.top === 'Armor plate' ? metal() : o.top === 'Tux shirt' ? std('#f4f4f6') : null;

    add(pivot, cap(armR, armLen - armR * 2), sleeveFull || skinM, [0, -armLen / 2, 0]);
    if (!sleeveFull && o.top === 'T-shirt') add(pivot, cap(armR * 1.3, armLen * 0.22), std(topC), [0, -armLen * 0.14, 0]);

    const hand = group(pivot, [0, -armLen - armR * 0.2, 0]);
    const gloveM = { 'Fingerless': std('#2a2a35'), 'Gauntlets': metal(), 'Haptic gloves': std('#1b1b26', { roughness: 0.3 }) }[o.gloves];
    add(hand, sph(armR * 1.18), gloveM || skinM);

    if (o.gloves === 'Haptic gloves') add(hand, sph(armR * 0.35, 8, 6), glow('#59e3ff'), [0, 0, armR * 1.05]);
    if (o.gloves === 'Fingerless') add(hand, sph(armR * 0.9, 12, 8, 0, TAU, Math.PI * 0.55, Math.PI * 0.45), skinM, [0, -armR * 0.2, 0]);
    hands.push(hand); // hands[0] = character's right hand (viewer's left)

  // ---- neck & head ----

  const head = group(body, [0, neckY + headR * 0.9, 0.005]);

  const F = headR * 0.93; // face surface depth

  else if (race === 'orc') for (const sx of [-1, 1]) add(head, cone(0.035, 0.09, 12), skinM, [sx * headR, 0.02, 0], [0, 0, -sx * 1.3], [1, 1, 0.55]);
  else if (race === 'android') for (const sx of [-1, 1]) add(head, cyl(0.035, 0.035, 0.03), metal(), [sx * headR * 0.95, 0, 0], [0, 0, Math.PI / 2]);

  if (S.eyeShape === 'Visor') {

        add(eye, new T.CircleGeometry(0.004, 10), std('#ffffff', { emissive: '#ffffff', emissiveIntensity: 0.6 }), [0.006, 0.006, 0.015]);
      }

      // brow
      add(head, box(0.045, 0.009, 0.01), std(shade(hairC, -0.2)), [sx * 0.052, 0.058, F - 0.004], [0, sx * 0.3, sx * 0.08]);
    });

  // nose & mouth

  add(head, tor(0.026, 0.006, Math.PI), std('#8a3a46'), [0, -0.055, F - 0.012], [0, 0, Math.PI]);

  if (race === 'dragonborn') for (const sx of [-1, 1]) add(head, cone(0.025, 0.14, 12), std('#f3e6c4'), [sx * 0.07, headR * 0.82, -0.04], [-0.7, 0, -sx * 0.35]);
  if (race === 'dragonborn') add(body, cone(0.06, 0.4, 12), skinM, [0, hipY - 0.05, -hipR * 0.9], [-2.2, 0, 0]);

      for (let k = 0; k < 6; k++) { const a = k / 6 * TAU; add(head, cone(0.015, 0.05, 6), metal('#ffc94a'), [Math.sin(a) * headR * 0.78, headR * 0.86 + 0.05, Math.cos(a) * headR * 0.78]); }

  // accessories
  if (o.accessory === 'Gem Pendant') {

function buildPet(A, k) {
  const { std, glow, metal, add, group, sph, cap, cyl, box, cone, tor } = k;
  if (S.pet === 'None') return;
  const P = group(A, [0.52, 0, 0.25], [0, -0.5, 0]);
  const quad = ({ body, belly, earType, tail, snout, legs = 0.12, size = 1 }) => {
    const g = group(P, [0, 0, 0], [0, 0, 0]); g.scale.setScalar(size);
    const bodyM = std(body), bellyM = std(belly || body);
    add(g, cap(0.06, 0.14), bodyM, [0, legs + 0.06, 0], [Math.PI / 2, 0, 0]);
    for (const [x, z] of [[-0.04, 0.07], [0.04, 0.07], [-0.04, -0.07], [0.04, -0.07]]) add(g, cyl(0.016, 0.016, legs), bodyM, [x, legs / 2, z]);
    const head = group(g, [0, legs + 0.13, 0.13]);
    add(head, sph(0.065, 20, 16), bodyM);
    add(head, sph(0.04, 14, 10), bellyM, [0, -0.02, 0.04], [0, 0, 0], snout ? [0.9, 0.8, 1.4] : [1, 0.8, 0.8]);
    for (const sx of [-1, 1]) {
      add(head, sph(0.012, 10, 8), std('#14101f', { roughness: 0.15 }), [sx * 0.03, 0.015, 0.058]);
      if (earType === 'point') add(head, cone(0.022, 0.06, 8), bodyM, [sx * 0.035, 0.07, 0], [0, 0, -sx * 0.25]);
      if (earType === 'flop') add(head, box(0.025, 0.07, 0.015), std(shade(body, -0.3)), [sx * 0.06, 0.0, 0], [0, 0, sx * 0.3]);
    }
    add(head, sph(0.01, 8, 6), std('#2a1a1a'), [0, -0.005, snout ? 0.1 : 0.08]);
    if (tail) { const tl = add(g, cap(0.02, tail), bodyM, [0, legs + 0.1, -0.13], [-0.8, 0, 0]); R3.anim.push(t => { tl.rotation.z = Math.sin(t / 250) * 0.4; }); return { g, head, tl }; }
    return { g, head };
  };
  switch (S.pet) {
    case 'Cat': quad({ body: '#f0a35e', belly: '#fff1e0', earType: 'point', tail: 0.16 }); break;
    case 'Dog': quad({ body: '#c8935a', belly: '#f3dfc0', earType: 'flop', tail: 0.08, snout: true, size: 1.15 }); break;
    case 'Fox': { const f = quad({ body: '#ff7a2f', belly: '#fff3e6', earType: 'point', tail: 0.14, snout: true }); add(f.tl, sph(0.03, 10, 8), std('#fff3e6'), [0, -0.1, 0]); break; }

    case 'Mini Dragon': {

      for (const sx of [-1, 1]) {
        add(d.head, cone(0.012, 0.06, 8), std('#f3e6c4'), [sx * 0.03, 0.07, -0.02], [-0.5, 0, 0]);
        const wing = add(d.g, new THREE.CircleGeometry(0.11, 3), std('#1f8a5b', { side: THREE.DoubleSide }), [sx * 0.07, 0.25, 0], [0, sx * 0.5, 0]);
        R3.anim.push(t => { wing.rotation.y = sx * (0.5 + Math.sin(t / 150) * 0.4); });
      }

    }
    case 'Robo Drone': {
      const dr = group(P, [0, 0.95, 0]);
      add(dr, sph(0.09, 24, 18), metal('#b8c0d0'));
      add(dr, sph(0.035, 14, 10), glow('#59e3ff'), [0, 0, 0.08]);
      add(dr, tor(0.13, 0.01), metal('#8b93a7'), [0, 0, 0], [Math.PI / 2, 0, 0]);

  }

function loop(t) {
  if (R3) {
    const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
    if (!R3.dragging && !reduce && t - R3.lastInteract > 2500) R3.yaw += 0.004;
    R3.root.rotation.y = R3.yaw;
    if (!reduce) for (const f of R3.anim) f(t);
    R3.renderer.render(R3.scene, R3.camera);
  }
  raf = requestAnimationFrame(loop);
}

      isOwner() ? h('div', { class: 'owner-row' }, h('button', { class: 'btn rainbow', type: 'button', on: { click: () => set({ outfit: Object.assign({}, EXCLUSIVE) }) } }, "Wear Orla's outfit"), h('span', { class: 'note' }, 'Black hooded cloak, tunic and boots with rainbow trim.')) : null,
      slot('headwear'), slot('top'),
      field('Top colour', swatches(CLOTH_COLORS, null, S.topColor, i => set({ topColor: i }))),
      slot('outer'),
      field('Jacket / cape colour', swatches(CLOTH_COLORS, null, S.outerColor, i => set({ outerColor: i }))),

      field('Bottoms colour', swatches(CLOTH_COLORS, null, S.bottomColor, i => set({ bottomColor: i }))),
      slot('shoes'), slot('gloves'), slot('accessory'),

  },
  gear() {
    const wFull = S.weapons.length >= 2, iFull = S.items.length >= 3;
    const toggle = (key, max) => v => set({ [key]: S[key].includes(v) ? S[key].filter(x => x !== v) : S[key].concat(v).slice(0, max) });
    return [
      h('h2', {}, 'Gear'),
      h('p', { class: 'lead' }, 'Fill your inventory. Your first weapon is the one in your hand. Tap a chosen item again to drop it.'),
      h('div', { class: 'field' },
        h('div', { class: 'label' }, h('span', {}, 'Weapons'), h('span', { class: 'counter' }, `${S.weapons.length} / 2`)),
        chooser(WEAPONS.map(([n, d, st]) => [n, n, `${d} · +1 ${st}`]), v => S.weapons.includes(v), toggle('weapons', 2), { small: true, disabled: v => wFull && !S.weapons.includes(v) })),
      S.weapons.length === 2 ? h('div', { class: 'top-actions' }, h('button', { class: 'btn', type: 'button', on: { click: () => set({ weapons: [S.weapons[1], S.weapons[0]] }) } }, `Hold ${S.weapons[1]} instead`)) : null,
      h('div', { class: 'field' },
        h('div', { class: 'label' }, h('span', {}, 'Magical items'), h('span', { class: 'counter' }, `${S.items.length} / 3`)),
        chooser(MAGIC_ITEMS.map(([n, d]) => [n, n, d]), v => S.items.includes(v), toggle('items', 3), { small: true, disabled: v => iFull && !S.items.includes(v) })),
    ];
  },
  pet() {
    return [
      h('h2', {}, 'Companion'),
      h('p', { class: 'lead' }, 'A pet or animal friend follows you through every sector.'),
      field('Companion', chooser(PETS.map(([n, d]) => [n, n, d]), v => v === S.pet, v => set({ pet: v }))),
      S.pet !== 'None' ? field('Companion name', h('input', { type: 'text', id: 'petName', maxlength: 16, value: S.petName, on: { input: e => set({ petName: e.target.value }, false) } })) : null,
    ];
  },
  review() {
    const st = stats(), img = h('img', { src: avatarImage(), alt: 'Your avatar' });
    const o = outfitNow();
    const wear = [o.headwear, o.top, o.outer, o.bottoms, o.shoes, o.gloves, o.accessory].filter(x => x !== 'None').join(', ');
    const rows = [
      ['Gender', GENDERS.find(x => x[0] === S.gender)[1]], ['Race', race().name], ['Class', `${cls().name} · ${S.sub}`], ['Powers', (S.powers.join(' + ') || 'None chosen') + (isOwner() ? ' · Legendary: ' + LEGENDARY.map(p => p[0]).join(', ') : '')],
      ['Speed', `${S.speed}/10 · ${speedMs()} m/s`], ['Age', ageLabel()], ['Height', heightLabel(S.height)], ['Weight', weightLabel(S.weight)],
      ['Skin', SKIN_NAMES[S.skin]], ['Eyes', `${EYE_NAMES[S.eyeColor]}, ${S.eyeShape.toLowerCase()}`], ['Hair', `${HAIR_NAMES[S.hairColor]} ${S.hairStyle.toLowerCase()}`],
      ['Wearing', wear], ['Weapons', S.weapons.join(', ') || 'Unarmed'], ['Magic items', S.items.join(', ') || 'None'], ['Companion', S.pet === 'None' ? 'None' : `${S.petName || 'Unnamed'} the ${S.pet}`],
      ['Stats', Object.entries(st).map(([k, v]) => `${k} ${v}`).join(' · ')],
    ];
    const sheet = `OASIS AVATAR · ID ${oasisId()}\nGamer name: ${S.name}\n` + rows.map(([k, v]) => `${k}: ${v}`).join('\n') + `\nLevel 1 · ${gems().toLocaleString()} Gems · Book of Lore · Keys: none yet`;
    const ready = S.powers.length === 2 && nameOk();
    return [
      h('h2', {}, 'Avatar ID card'),
      h('div', { class: 'idcard' }, img,
        h('div', {}, h('h3', {}, S.name), h('div', { class: 'rig-id' }, `OASIS ID ${oasisId()} · LVL 1 · ${gems().toLocaleString()} gems`),
          h('dl', { class: 'kv' }, rows.flatMap(([k, v]) => [h('dt', {}, k), h('dd', {}, v)])),
          h('div', { class: 'keys' }, h('span', {}, 'Copper key'), h('span', {}, 'Jade key'), h('span', {}, 'Crystal key')))),
      !ready ? h('p', { class: 'note warn' }, !nameOk() ? 'Choose an available gamer name before you log in.' : 'Pick two powers before you log in.') : null,
      field('Character sheet', h('textarea', { id: 'sheet', readonly: true }, sheet)),
      h('div', { class: 'top-actions' },
        h('button', { class: 'btn primary', type: 'button', disabled: !ready, on: { click: () => toast(`${S.name} is ready to log in. Saved in this browser.`) } }, 'Log in to the OASIS'),
        h('button', { class: 'btn', type: 'button', on: { click: () => copy(sheet) } }, 'Copy character sheet')),
    ];
  },
};
function nameStatus() {
  const st = $('name-status'), row = $('owner-row');
  if (!st) return;
  row.hidden = true; st.className = 'note';
  if (!S.name.trim()) st.textContent = 'Pick a gamer name to log in.';
  else if (isReserved(S.name) && !isOwner()) { st.className = 'note warn'; st.textContent = `“${RESERVED_NAME}” is taken. If it's your name, enter your owner code.`; row.hidden = false; }
  else if (isOwner()) { st.className = 'note ok'; st.textContent = 'Welcome back, Orla. Legendary powers unlocked.'; }
  else st.textContent = 'Name available.';
}
async function unlockOwner(code) {
  let hex = '';
  try {
    const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(code.trim().toLowerCase()));
    hex = [...new Uint8Array(buf)].map(b => b.toString(16).padStart(2, '0')).join('');
  } catch (e) { toast('This browser cannot check the code.'); return; }
  if (hex === OWNER_CODE_SHA256) { S.owner = true; S.name = RESERVED_NAME; S.outfit = Object.assign({}, EXCLUSIVE); save(); updateRig(); buildAvatar(); renderPane(); toast('Welcome, Orla: legendary powers, your outfit and 10,000 gems unlocked'); }
  else toast('That code is not right.');
}
const ageLabel = () => `${S.age} yrs`;
const speedLabel = () => `${S.speed}/10 · ${speedMs()} m/s`;

function renderTabs() {
  $('tabs').replaceChildren(...TABS.map(([id, label], i) =>
    h('button', { class: 'tab', role: 'tab', type: 'button', 'aria-selected': String(S.tab === id), on: { click: () => { S.tab = id; save(); renderTabs(); renderPane(); } } },
      h('span', { class: 'n' }, String(i + 1).padStart(2, '0')), label)));
}
function renderPane() {
  const i = TABS.findIndex(t => t[0] === S.tab);
  const nav = h('div', { class: 'pane-nav' },
    i > 0 ? h('button', { class: 'btn', type: 'button', on: { click: () => go(i - 1) } }, '← ' + TABS[i - 1][1]) : h('span'),
    i < TABS.length - 1 ? h('button', { class: 'btn primary', type: 'button', on: { click: () => go(i + 1) } }, TABS[i + 1][1] + ' →') : h('span'));
  $('pane').replaceChildren(...PANES[S.tab]().filter(Boolean), nav);
}
function go(i) { S.tab = TABS[i][0]; save(); renderTabs(); renderPane(); $('tabs').children[i].scrollIntoView({ block: 'nearest', inline: 'nearest' }); }

function updateRig() {
  $('rig-name').textContent = nameOk() ? S.name : 'Enter gamer name';
  $('rig-name').style.color = nameOk() ? '' : 'var(--muted)';
  $('rig-id').textContent = `ID ${oasisId()}`;
  $('rig-sub').textContent = `${race().name} ${cls().name} · ${S.sub} · ${S.age} yrs`;
  $('rig-chips').replaceChildren(...(isOwner() ? LEGENDARY.map(p => h('span', { class: 'chip legend' }, p[0])) : []),
    ...S.powers.map(p => h('span', { class: 'chip power' }, p)),
    ...S.weapons.map(w => h('span', { class: 'chip' }, w)),
    ...S.items.map(w => h('span', { class: 'chip item' }, w)),
    ...(S.pet !== 'None' ? [h('span', { class: 'chip' }, `${S.petName || 'Pet'} · ${S.pet}`)] : []));
  const st = stats();
  $('rig-stats').replaceChildren(...Object.entries(st).flatMap(([k, v]) => [
    h('span', { class: 'lbl' }, k), h('div', { class: 'bar' }, h('i', { style: `width:${v / 15 * 100}%` })), h('span', { class: 'num' }, String(v))]));
  $('rig-vitals').replaceChildren(
    h('span', {}, 'HP ', h('b', {}, String(50 + st.VIT * 10))),
    h('span', {}, 'MANA ', h('b', {}, String(30 + st.INT * 8))),
    h('span', {}, 'SPD ', h('b', {}, speedMs() + ' m/s')));
  renderBag();
  if (S.tab === 'review') { const img = document.querySelector('.idcard img'); if (img) img.src = avatarImage(); }
  renderTabs();
}

function achievements() {
  const o = outfitNow();
  return [
    ['Avatar Forged', 'Chose a gamer name', nameOk()],
    ['Power Up', 'Picked two powers', S.powers.length === 2],
    ['Armed & Ready', 'Equipped a weapon', S.weapons.length > 0],
    ['Collector', 'Carry three magical items', S.items.length === 3],
    ['Best Friends', 'Named your companion', S.pet !== 'None' && !!S.petName.trim()],
    ['Fashionista', 'Wear something in every outfit slot', Object.values(o).every(v => v !== 'None')],
    ['Speed Demon', 'Max out your speed', S.speed === 10],
    ['Gem Hoarder', 'Hold 10,000 gems', gems() >= 10000],
    ['Legend', 'Own the legendary powers', isOwner()],
    ['Egg Hunter', 'Find the copper, jade and crystal keys', false],
  ];
}
function renderBag() {
  const owner = isOwner();
  const bag = $('bag');
  bag.className = 'bag' + (owner ? ' rainbow' : '');
  bag.replaceChildren(
    h('div', { class: 'bag-title' }, nameOk() ? `${S.name}'s bag` : 'Your bag'),
    h('div', { class: 'bag-items' },
      h('div', { class: 'bag-item' }, h('span', { class: 'gem', 'aria-hidden': 'true' }), h('span', {}, h('b', {}, gems().toLocaleString()), ' Gems')),
      h('button', { class: 'bag-item book', type: 'button', on: { click: openLore } }, h('span', { class: 'book-ico', 'aria-hidden': 'true' }), h('span', {}, h('b', {}, 'Book of Lore'), ' · open'))));
}
function openLore() {
  const d = $('lore'), st = stats(), ach = achievements(), got = ach.filter(a => a[2]).length;
  d.className = 'lore' + (isOwner() ? ' rainbow' : '');
  d.style.setProperty('--book', cls().color);
  d.replaceChildren(
    h('div', { class: 'lore-head' },
      h('div', {}, h('div', { class: 'lore-kicker' }, 'Book of Lore'), h('h2', { id: 'lore-title' }, nameOk() ? S.name : 'Unnamed adventurer'),
        h('div', { class: 'lore-sub' }, `${race().name} ${cls().name} · ${S.sub} · Level 1 · ${gems().toLocaleString()} gems`)),
      h('button', { class: 'btn', type: 'button', on: { click: () => d.close() } }, 'Close')),
    h('div', { class: 'lore-pages' },
      h('section', {},
        h('h3', {}, `Achievements · ${got}/${ach.length}`),
        h('ul', { class: 'ach' }, ach.map(([n, desc, ok]) => h('li', { class: ok ? 'ok' : '' }, h('b', {}, (ok ? '★ ' : '☆ ') + n), h('small', {}, desc)))),
      ),
      h('section', {},
        h('h3', {}, 'Stats'),
        h('div', { class: 'stats' }, Object.entries(st).flatMap(([k, v]) => [h('span', { class: 'lbl' }, k), h('div', { class: 'bar' }, h('i', { style: `width:${v / 15 * 100}%` })), h('span', { class: 'num' }, String(v))])),
        h('h3', {}, 'Powers'),
        h('p', {}, S.powers.join(', ') || 'None yet', isOwner() ? h('span', { class: 'legend-tag' }, ' + ' + LEGENDARY.map(p => p[0]).join(', ')) : null),
        h('h3', {}, 'Carrying'),
        h('p', {}, [S.weapons.join(', '), S.items.join(', ')].filter(Boolean).join(' · ') || 'Nothing yet'),
        h('h3', {}, 'Keys'),
        h('div', { class: 'keys' }, h('span', {}, 'Copper'), h('span', {}, 'Jade'), h('span', {}, 'Crystal')))));
  if (d.showModal) d.showModal(); else d.setAttribute('open', '');
}

function randomize() {
  const pick = a => a[Math.floor(Math.random() * a.length)];
  const c = pick(CLASSES);
  const shuffled = POWERS.map(p => p[0]).sort(() => Math.random() - 0.5);
  const names = ['Art3mis', 'Aech', 'Daito', 'Shoto', 'Nova', 'Pixel', 'Glitch', 'Rook', 'Kaiju', 'Vex', 'Byte', 'Zephyr', 'Halcyon', 'Echo'];
  const outfit = {}; for (const k in OUTFIT) outfit[k] = pick(OUTFIT[k].items);
  const r = pick(RACES).id;
  Object.assign(S, {
    name: isOwner() ? S.name : pick(names), gender: pick(GENDERS)[0], age: 10 + Math.floor(Math.random() * (r === 'elf' ? 250 : 50)), race: r, cls: c.id, sub: pick(c.subs)[0],
    powers: shuffled.slice(0, 2), speed: 1 + Math.floor(Math.random() * 10),
    height: r === 'dwarf' || r === 'halfling' || r === 'gnome' ? 105 + Math.floor(Math.random() * 30) : 150 + Math.floor(Math.random() * 55),
    weight: 45 + Math.floor(Math.random() * 70), skin: Math.floor(Math.random() * SKIN.length),
    hairStyle: pick(HAIR_STYLES), hairColor: Math.floor(Math.random() * HAIR_COLORS.length),
    eyeColor: Math.floor(Math.random() * EYE_COLORS.length), eyeShape: pick(EYE_SHAPES)[0], outfit,
    topColor: Math.floor(Math.random() * CLOTH_COLORS.length), outerColor: Math.floor(Math.random() * CLOTH_COLORS.length), bottomColor: Math.floor(Math.random() * CLOTH_COLORS.length),
    weapons: WEAPONS.map(w => w[0]).sort(() => Math.random() - 0.5).slice(0, 1 + Math.floor(Math.random() * 2)),
    items: MAGIC_ITEMS.map(w => w[0]).sort(() => Math.random() - 0.5).slice(0, 1 + Math.floor(Math.random() * 3)),
    pet: pick(PETS)[0], petName: pick(['Max', 'Bit', 'Sprocket', 'Nugget', 'Ziggy', 'Luna', 'Mochi']),
  });
  save(); buildAvatar(); updateRig(); renderPane();
}

function toast(msg) { const t = $('toast'); t.textContent = msg; t.hidden = false; clearTimeout(toast.t); toast.t = setTimeout(() => t.hidden = true, 2600); }
function copy(text) {
  const done = () => toast('Character sheet copied');
  try { navigator.clipboard.writeText(text).then(done, () => { $('sheet').select(); toast('Press Ctrl/Cmd+C to copy'); }); }
  catch (e) { $('sheet').select(); toast('Press Ctrl/Cmd+C to copy'); }
}

function start(seed) {
  load(seed);
  $('randomize').addEventListener('click', randomize);
  $('reset').addEventListener('click', () => { const owner = S.owner; S = structuredClone(DEFAULT); S.owner = owner; save(); buildAvatar(); updateRig(); renderPane(); toast('Started over'); });
  initThree(); buildAvatar();
  updateRig(); renderPane();
  cancelAnimationFrame(raf); raf = requestAnimationFrame(loop);
  window.claude?.hot?.snapshot?.(() => S);
}
window.claude?.hot?.ready ? window.claude.hot.ready(start) : start(window.claude?.hot?.data ?? {});
})();
</script>
