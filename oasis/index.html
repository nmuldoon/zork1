<style>
/* Layout: a sticky "rig" preview (live avatar + stats) beside a tabbed configuration console.
   Single dark look by choice: you're inside the visor. */
:root {
  --void: #0f0c22;
  --panel: #19153a;
  --panel-2: #221d4a;
  --line: #352e66;
  --ink: #ece9ff;
  --muted: #9d96cc;
  --gold: #ffc94a;      /* the egg hunter's accent: copper/jade/crystal key gold */
  --cyan: #59e3ff;
  --danger: #ff6f91;
  --ok: #7cf2a6;
  --display: "Audiowide", "Arial Black", system-ui, sans-serif;
  --body: "Chakra Petch", "Segoe UI", system-ui, sans-serif;
  --data: "VT323", ui-monospace, "Courier New", monospace;
  --r: 10px;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { min-height: 100%; }
body {
  background: radial-gradient(1200px 600px at 70% -10%, #2a1f63 0%, transparent 60%), var(--void);
  color: var(--ink); font: 16px/1.5 var(--body);
  padding-inline: 16px; padding-block: 20px 40px;
}
.wrap { max-width: 1240px; margin: 0 auto; display: flex; flex-direction: column; gap: 20px; }

header.top { display: flex; flex-wrap: wrap; align-items: end; justify-content: space-between; gap: 12px; }
.brand h1 { font: 400 clamp(26px, 4vw, 40px)/1.05 var(--display); margin: 0; letter-spacing: .04em; text-wrap: balance; }
.brand h1 span { color: var(--gold); }
.brand p { margin: 4px 0 0; color: var(--muted); font-size: 14px; }
.top-actions { display: flex; flex-wrap: wrap; gap: 8px; }

button { font: inherit; color: inherit; cursor: pointer; }
.btn {
  background: var(--panel-2); border: 1px solid var(--line); border-radius: 8px;
  padding: 8px 14px; font-weight: 600; letter-spacing: .02em;
}
.btn:hover { border-color: var(--cyan); }
.btn.primary { background: var(--gold); color: #1d1500; border-color: var(--gold); }
.btn.primary:hover { filter: brightness(1.08); }
:focus-visible { outline: 2px solid var(--cyan); outline-offset: 2px; }

.layout { display: grid; grid-template-columns: minmax(0, 380px) minmax(0, 1fr); gap: 20px; align-items: start; }

/* ---------- rig (preview) ---------- */
.rig {
  position: sticky; top: calc(env(safe-area-inset-top, 0px) + 12px);
  background: var(--panel); border: 1px solid var(--line); border-radius: var(--r);
  padding: 16px; display: flex; flex-direction: column; gap: 12px;
}
.rig-head { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
.rig-name { font: 400 22px/1.1 var(--display); margin: 0; overflow-wrap: anywhere; }
.rig-id { font: 20px/1 var(--data); color: var(--cyan); white-space: nowrap; }
.rig-sub { color: var(--muted); font-size: 14px; margin-top: -6px; }
canvas#avatar { width: 100%; max-width: 100%; aspect-ratio: 48 / 72; image-rendering: pixelated; border-radius: 8px; background: #0a0819; display: block; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { font-size: 12px; font-weight: 600; text-transform: uppercase; letter-spacing: .08em; padding: 3px 8px; border-radius: 999px; border: 1px solid var(--line); color: var(--muted); }
.chip.item { color: var(--cyan); border-color: color-mix(in srgb, var(--cyan) 45%, transparent); }
.chip.power { color: var(--gold); border-color: color-mix(in srgb, var(--gold) 50%, transparent); }
.stats { display: grid; grid-template-columns: auto 1fr auto; gap: 4px 10px; align-items: center; font: 20px/1 var(--data); }
.stats .lbl { color: var(--muted); letter-spacing: .05em; }
.bar { height: 8px; background: var(--void); border-radius: 4px; overflow: hidden; }
.bar i { display: block; height: 100%; background: linear-gradient(90deg, var(--cyan), var(--gold)); transition: width .25s; }
.stats .num { font-variant-numeric: tabular-nums; text-align: right; min-width: 2ch; }
.vitals { display: flex; gap: 16px; font: 20px/1 var(--data); color: var(--muted); }
.vitals b { color: var(--ink); font-weight: 400; }

/* ---------- console ---------- */
.console { background: var(--panel); border: 1px solid var(--line); border-radius: var(--r); min-width: 0; }
.tabs { display: flex; gap: 2px; overflow-x: auto; border-bottom: 1px solid var(--line); padding: 6px 6px 0; scrollbar-width: thin; }
.tab {
  background: none; border: none; border-bottom: 2px solid transparent;
  padding: 10px 12px; white-space: nowrap; color: var(--muted); font-weight: 600; font-size: 14px;
  display: flex; align-items: center; gap: 6px;
}
.tab .n { font: 18px/1 var(--data); color: var(--line); }
.tab[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--gold); }
.tab[aria-selected="true"] .n { color: var(--gold); }
.tab .done { width: 6px; height: 6px; border-radius: 50%; background: var(--ok); }
.pane { padding: 20px; display: flex; flex-direction: column; gap: 22px; }
.pane h2 { font: 400 20px/1.2 var(--display); margin: 0; letter-spacing: .03em; }
.pane .lead { margin: -14px 0 0; color: var(--muted); font-size: 14px; max-width: 65ch; }

.field { display: flex; flex-direction: column; gap: 8px; }
.field > .label { font-size: 12px; font-weight: 700; text-transform: uppercase; letter-spacing: .12em; color: var(--muted); display: flex; justify-content: space-between; gap: 8px; }
.field > .label output, .field > .label .hint { font: 20px/1 var(--data); letter-spacing: 0; text-transform: none; color: var(--cyan); }
.row2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 18px; }

input[type="text"] {
  background: var(--void); border: 1px solid var(--line); border-radius: 8px; color: var(--ink);
  font: 600 18px var(--body); padding: 10px 12px; width: 100%;
}
input[type="text"]:focus { border-color: var(--cyan); outline: none; }
input[type="range"] { width: 100%; accent-color: var(--gold); }

.choices { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 8px; }
.choices.cols4 { grid-template-columns: repeat(4, minmax(0, 1fr)); }
.choices.small { grid-template-columns: repeat(auto-fill, minmax(110px, 1fr)); }
.opt {
  text-align: left; background: var(--panel-2); border: 1px solid var(--line); border-radius: 8px;
  padding: 10px 12px; display: flex; flex-direction: column; gap: 2px; min-width: 0;
}
.opt b { font-weight: 600; font-size: 15px; }
.opt small { color: var(--muted); font-size: 12px; line-height: 1.35; }
.opt:hover:not(:disabled) { border-color: var(--cyan); }
.opt[aria-pressed="true"] { border-color: var(--gold); background: color-mix(in srgb, var(--gold) 14%, var(--panel-2)); }
.opt[aria-pressed="true"] b { color: var(--gold); }
.opt:disabled { opacity: .4; cursor: not-allowed; }

.swatches { display: flex; flex-wrap: wrap; gap: 8px; }
.sw { width: 36px; height: 36px; border-radius: 50%; border: 2px solid var(--line); padding: 0; position: relative; }
.sw[aria-pressed="true"] { border-color: var(--gold); box-shadow: 0 0 0 3px color-mix(in srgb, var(--gold) 35%, transparent); }
.sw:hover { border-color: var(--cyan); }

.counter { font: 22px/1 var(--data); color: var(--gold); }
.note { font-size: 13px; color: var(--muted); }
.note.warn { color: var(--danger); }

/* ---------- review / ID card ---------- */
.idcard { display: grid; grid-template-columns: 140px minmax(0, 1fr); gap: 18px; background: linear-gradient(135deg, var(--panel-2), var(--void)); border: 1px solid var(--gold); border-radius: 12px; padding: 18px; }
.idcard img { width: 100%; max-width: 100%; image-rendering: pixelated; border-radius: 6px; background: #0a0819; }
.idcard h3 { font: 400 24px/1.1 var(--display); margin: 0; overflow-wrap: anywhere; }
.idcard .kv { display: grid; grid-template-columns: max-content minmax(0, 1fr); gap: 4px 14px; margin-top: 10px; font-size: 14px; }
.idcard .kv dt { color: var(--muted); text-transform: uppercase; letter-spacing: .08em; font-size: 11px; padding-top: 3px; }
.idcard .kv dd { margin: 0; overflow-wrap: anywhere; }
.keys { display: flex; gap: 12px; font: 20px/1 var(--data); color: var(--muted); margin-top: 10px; flex-wrap: wrap; }
.keys span::before { content: "○ "; }
.pane-nav { display: flex; justify-content: space-between; gap: 8px; border-top: 1px solid var(--line); padding-top: 16px; }
.toast { position: fixed; left: 50%; bottom: calc(env(safe-area-inset-bottom, 0px) + 20px); transform: translateX(-50%); background: var(--gold); color: #1d1500; padding: 8px 16px; border-radius: 8px; font-weight: 700; }
textarea#sheet { width: 100%; min-height: 160px; background: var(--void); color: var(--ink); border: 1px solid var(--line); border-radius: 8px; font: 18px/1.2 var(--data); padding: 10px; }
.foot { color: var(--muted); font-size: 12px; text-align: center; }

@media (max-width: 640px) { .choices.cols4 { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
@media (max-width: 860px) {
  .layout { grid-template-columns: 1fr; }
  .rig { position: static; display: grid; grid-template-columns: minmax(0, 150px) minmax(0, 1fr); align-items: start; }
  .rig > canvas { grid-row: span 5; }
  .rig-head, .rig-sub, .chips, .stats, .vitals { grid-column: 2; }
  .row2 { grid-template-columns: 1fr; }
}
@media (max-width: 480px) {
  .rig { grid-template-columns: minmax(0, 110px) minmax(0, 1fr); }
  .idcard { grid-template-columns: 1fr; }
  .idcard img { max-width: 160px; }
}
@media (prefers-reduced-motion: reduce) { .bar i { transition: none; } }
</style>

</div>

    case 'Headphones': P(hx, hy - 3, 12, 1, '#2a2a35'); P(hx - 2, hy + 3, 3, 5, '#2a2a35'); P(hx + 11, hy + 3, 3, 5, '#2a2a35'); P(hx - 2, hy + 4, 1, 3, accent); P(hx + 13, hy + 4, 1, 3, accent); break;
    case 'Crown': P(hx + 1, hy - 3, 10, 2, '#ffc94a'); for (let i = 0; i < 4; i++) P(hx + 1 + i * 3, hy - 5, 1, 2, '#ffc94a'); P(cx - 1, hy - 3, 2, 1, '#e94b3c'); break;
    case 'Helmet': P(hx - 1, hy - 2, 14, 9, '#8b93a7'); P(hx + 1, ey, 10, 2, '#14101f'); P(hx + 2, ey, 3, 1, accent); P(hx - 1, hy - 2, 14, 1, '#c9d1d9'); break;
    case 'VR Visor': P(hx - 1, ey - 1, 14, 4, '#14101f'); P(hx, ey, 12, 2, '#20304a'); P(hx + 1, ey, 4, 1, '#59e3ff'); P(hx - 1, hy + 2, 1, 3, '#14101f'); P(hx + 12, hy + 2, 1, 3, '#14101f'); break;
    case 'Wizard Hat': { const hcW = '#5b3fd1'; for (let i = 0; i < 8; i++) P(cx - 1 - Math.floor(i * 0.8), hy - 9 + i, 2 + Math.floor(i * 1.6), 1, hcW); P(hx - 3, hy - 1, 18, 2, shade(hcW, -0.3)); P(cx, hy - 6, 1, 1, '#ffc94a'); P(cx - 3, hy - 3, 1, 1, '#ffc94a'); break; }
  }

  // accessories
  if (o.accessory === 'Sunglasses' && o.headwear !== 'VR Visor' && o.headwear !== 'Helmet') { P(hx + 1, ey - 1, 10, 1, '#14101f'); P(exL - 1, ey - 1, 4, 3, '#14101f'); P(exR, ey - 1, 4, 3, '#14101f'); P(exL, ey - 1, 1, 1, '#59e3ff'); }
  if (o.accessory === 'Scarf') { P(cx - 4, hy + 12, 8, 3, '#e94b3c'); P(cx + 1, hy + 15, 3, 6, '#c03a2c'); }
  if (o.accessory === 'Gold chain') { for (let x = cx - 3; x <= cx + 2; x++) P(x, Math.abs(x - cx + 0.5) < 2 ? torsoY + 3 : torsoY + 2, 1, 1, '#ffc94a'); P(cx - 1, torsoY + 4, 2, 2, '#ffc94a'); }
  if (o.accessory === 'Backpack') { P(tx + 1, torsoY, 1, torsoH, '#4a3220'); P(tx + tw - 2, torsoY, 1, torsoH, '#4a3220'); }

  // main weapon in the right hand (viewer's left)
  const wpn = S.weapons[0];
  if (wpn) {
    const hxw = tx - aw + 1, hyw = torsoY + armLen; // hand position
    const steel = '#d6dbe6', wood = '#8a5a3b', gold = '#ffc94a';
    switch (wpn) {
      case 'Longsword': P(hxw, hyw - 12, 1, 12, steel); P(hxw - 1, hyw - 1, 3, 1, gold); P(hxw, hyw + 1, 1, 2, wood); break;
      case 'Katana': for (let i = 0; i < 12; i++) P(hxw - Math.floor(i / 6), hyw - 1 - i, 1, 1, steel); P(hxw - 1, hyw, 3, 1, '#14101f'); P(hxw, hyw + 1, 1, 2, '#e94b3c'); break;
      case 'Battle Axe': P(hxw, hyw - 10, 1, 14, wood); P(hxw - 3, hyw - 10, 3, 4, steel); P(hxw - 4, hyw - 9, 1, 2, steel); break;
      case 'War Hammer': P(hxw, hyw - 9, 1, 13, wood); P(hxw - 2, hyw - 11, 5, 3, '#8b93a7'); break;
      case 'Twin Daggers': P(hxw, hyw - 4, 1, 4, steel); P(hxw - 1, hyw, 3, 1, gold); P(tx + tw + 1, hyw - 4, 1, 4, steel); P(tx + tw, hyw, 3, 1, gold); break;
      case 'Energy Blade': P(hxw, hyw - 13, 1, 13, accent); P(hxw, hyw - 13, 1, 1, '#ffffff'); P(hxw - 1, hyw - 12, 1, 11, shade(accent, -0.5)); P(hxw, hyw, 1, 3, '#9aa5b8'); break;
      case 'Longbow': for (let i = 0; i < 16; i++) P(hxw - 2 + Math.round(Math.sin(i / 15 * Math.PI) * -2), hyw - 8 + i, 1, 1, wood); P(hxw - 2, hyw - 8, 1, 16, '#f2f2f2'); break;
      case 'Crossbow': P(hxw - 3, hyw - 1, 7, 1, wood); P(hxw - 4, hyw - 3, 1, 5, steel); P(hxw - 3, hyw - 2, 1, 1, steel); break;
      case 'Blaster Pistol': P(hxw - 3, hyw - 1, 5, 2, '#3a3a48'); P(hxw, hyw + 1, 2, 2, '#3a3a48'); P(hxw - 3, hyw - 1, 1, 1, '#ff6f61'); break;
      case 'Plasma Rifle': P(hxw - 6, hyw - 1, 10, 2, '#3a3a48'); P(hxw - 6, hyw - 1, 2, 1, '#7cf2a6'); P(hxw, hyw + 1, 2, 2, '#3a3a48'); P(hxw - 3, hyw - 2, 2, 1, '#59e3ff'); break;
      case 'Magic Staff': P(hxw, hyw - 14, 1, 20, wood); P(hxw - 1, hyw - 16, 3, 3, '#a77bff'); P(hxw, hyw - 15, 1, 1, '#ffffff'); break;
      case 'Chain Whip': for (let i = 0; i < 10; i++) P(hxw - Math.floor(i / 2), hyw + 1 + i, 1, 1, i % 2 ? '#8b93a7' : '#c9d1d9'); P(hxw, hyw - 1, 1, 2, wood); break;
    }
  }

  // power sparks
  const sparkCols = { Fire: '#ff7a2f', Ice: '#bfe9ff', 'Nature Control': '#3ecf8e', 'Animal Shifting': '#c8935a', Airbending: '#f2f2f2', Electricity: '#59e3ff',
    'Barrier Creation': '#a77bff', 'Energy Blast': '#ffd23f', 'Super Speed': '#ff6f61', Agility: '#4fd1a5', 'Mind Reading': '#ff7ad9', Telekinesis: '#b56cff',
    'Shadow Control': '#5a4a7a', Flying: '#dfe7ff', Accuracy: '#ff9f43', Healing: '#7cf2a6', 'Super Strength': '#e94b3c' };
  if (!reduce) S.powers.forEach((p, i) => {
    const c = sparkCols[p] || accent, a = t / 500 + i * Math.PI;
    P(cx + Math.round(Math.cos(a) * 13), torsoY + 4 + Math.round(Math.sin(a) * 6), 1, 1, c);
    P(cx + Math.round(Math.cos(a + 2) * 12), torsoY + Math.round(Math.sin(a + 2) * 8), 1, 1, shade(c, 0.4));
  });
}

let raf;
function loop(t) { drawAvatar(t); raf = requestAnimationFrame(loop); }

// ======================= UI =======================
function chooser(items, current, onPick, { small = false, cols4 = false, disabled = () => false } = {}) {
  return h('div', { class: 'choices' + (small ? ' small' : '') + (cols4 ? ' cols4' : '') }, items.map(([val, title, desc]) =>
    h('button', { class: 'opt', type: 'button', 'aria-pressed': String(current(val)), disabled: disabled(val), on: { click: () => onPick(val) } },
      h('b', {}, title), desc ? h('small', {}, desc) : null)));
}
function swatches(colors, names, current, onPick) {
  return h('div', { class: 'swatches', role: 'group' }, colors.map((c, i) =>
    h('button', { class: 'sw', type: 'button', title: names ? names[i] : c, 'aria-label': names ? names[i] : c, 'aria-pressed': String(current === i), style: `background:${c}`, on: { click: () => onPick(i) } })));
}
function field(label, control, value) {
  return h('div', { class: 'field' }, h('div', { class: 'label' }, h('span', {}, label), value != null ? h('output', {}, value) : null), control);
}
function slider(id, min, max, val, step, onInput) {
  return h('input', { type: 'range', id, min, max, step, value: val, on: { input: e => onInput(+e.target.value) } });
}
function set(patch, rerender = true) { Object.assign(S, patch); save(); updateRig(); if (rerender) renderPane(); }

const PANES = {
  identity() {
    return [
      h('h2', {}, 'Who are you in the OASIS?'),
      h('p', { class: 'lead' }, 'Your avatar name is how other gunters will know you. Real names stay outside the visor.'),
      h('div', { class: 'row2' },
        field('Avatar name', h('input', { type: 'text', id: 'name', maxlength: 20, value: S.name, on: { input: e => set({ name: e.target.value || 'Unnamed' }, false) } })),
        field('Age', slider('age', 13, 300, S.age, 1, v => { S.age = v; save(); updateRig(); $('age').closest('.field').querySelector('output').textContent = ageLabel(); }), ageLabel())),
      field('Race', chooser(RACES.map(r => [r.id, r.name, r.d]), v => v === S.race, v => set({ race: v }))),
    ];
  },
  class() {
    const c = cls();
    return [
      h('h2', {}, 'Class & subclass'),
      h('p', { class: 'lead' }, 'Your class sets your main stats. The subclass is your specialty inside it.'),
      field('Class', chooser(CLASSES.map(k => [k.id, k.name, k.d]), v => v === S.cls, v => { const nc = CLASSES.find(k => k.id === v); set({ cls: v, sub: nc.subs[0][0] }); }, { cols4: true })),
      field(`${c.name} subclass`, chooser(c.subs.map(([n, d]) => [n, n, d]), v => v === S.sub, v => set({ sub: v }))),
    ];
  },
  powers() {
    const full = S.powers.length >= 2;
    return [
      h('h2', {}, 'Pick two powers'),
      h('p', { class: 'lead' }, 'Choose exactly two of the 17. Tap a chosen power again to swap it out.'),
      h('div', { class: 'field' },
        h('div', { class: 'label' }, h('span', {}, 'Powers'), h('span', { class: 'counter' }, `${S.powers.length} / 2`)),
        chooser(POWERS.map(([n, d]) => [n, n, d]), v => S.powers.includes(v), v => {
          const p = S.powers.includes(v) ? S.powers.filter(x => x !== v) : S.powers.concat(v).slice(0, 2);
          set({ powers: p });
        }, { disabled: v => full && !S.powers.includes(v) }),
        h('div', { class: 'note' + (S.powers.length < 2 ? ' warn' : '') }, S.powers.length < 2 ? `Choose ${2 - S.powers.length} more.` : 'Both slots filled.')),
      field('Speed', slider('speed', 1, 10, S.speed, 1, v => { S.speed = v; save(); updateRig(); $('speed').closest('.field').querySelector('output').textContent = speedLabel(); }), speedLabel()),
      h('p', { class: 'note' }, 'Speed sets your Agility stat. At 7 and above you leave motion trails.'),
    ];
  },
  body() {
    return [
      h('h2', {}, 'Body'),
      h('p', { class: 'lead' }, 'Height and weight change your avatar’s build in the preview.'),
      h('div', { class: 'row2' },
        field('Height', slider('height', 100, 230, S.height, 1, v => { S.height = v; save(); updateRig(); $('height').closest('.field').querySelector('output').textContent = heightLabel(v); }), heightLabel(S.height)),
        field('Weight', slider('weight', 30, 180, S.weight, 1, v => { S.weight = v; save(); updateRig(); $('weight').closest('.field').querySelector('output').textContent = weightLabel(v); }), weightLabel(S.weight))),
      field('Skin tone', swatches(SKIN, SKIN_NAMES, S.skin, i => set({ skin: i })), SKIN_NAMES[S.skin]),
    ];
  },
  face() {
    return [
      h('h2', {}, 'Face & hair'),
      field('Eye colour', swatches(EYE_COLORS, EYE_NAMES, S.eyeColor, i => set({ eyeColor: i })), EYE_NAMES[S.eyeColor]),
      field('Eye shape', chooser(EYE_SHAPES.map(([n, d]) => [n, n, d]), v => v === S.eyeShape, v => set({ eyeShape: v }), { small: true })),
      field('Hair style', chooser(HAIR_STYLES.map(n => [n, n]), v => v === S.hairStyle, v => set({ hairStyle: v }), { small: true })),
      field('Hair colour', swatches(HAIR_COLORS, HAIR_NAMES, S.hairColor, i => set({ hairColor: i })), HAIR_NAMES[S.hairColor]),
    ];
  },
  outfit() {
    const slot = key => field(OUTFIT[key].label, chooser(OUTFIT[key].items.map(n => [n, n]), v => v === S.outfit[key], v => set({ outfit: Object.assign({}, S.outfit, { [key]: v }) }), { small: true }));
    return [
      h('h2', {}, 'Outfit'),
      h('p', { class: 'lead' }, 'Pick each item separately, then colour your top, jacket and bottoms.'),
      slot('headwear'), slot('top'),
      field('Top colour', swatches(CLOTH_COLORS, null, S.topColor, i => set({ topColor: i }))),
      slot('outer'),
      field('Jacket / cape colour', swatches(CLOTH_COLORS, null, S.outerColor, i => set({ outerColor: i }))),
      slot('bottoms'),
      field('Bottoms colour', swatches(CLOTH_COLORS, null, S.bottomColor, i => set({ bottomColor: i }))),
      slot('shoes'), slot('gloves'), slot('accessory'),
    ];
  },
  gear() {
    const wFull = S.weapons.length >= 2, iFull = S.items.length >= 3;
    const toggle = (key, max) => v => set({ [key]: S[key].includes(v) ? S[key].filter(x => x !== v) : S[key].concat(v).slice(0, max) });
    return [
      h('h2', {}, 'Gear'),
      h('p', { class: 'lead' }, 'Fill your inventory. Your first weapon is the one in your hand. Tap a chosen item again to drop it.'),
      h('div', { class: 'field' },
        h('div', { class: 'label' }, h('span', {}, 'Weapons'), h('span', { class: 'counter' }, `${S.weapons.length} / 2`)),
        chooser(WEAPONS.map(([n, d, st]) => [n, n, `${d} · +1 ${st}`]), v => S.weapons.includes(v), toggle('weapons', 2), { small: true, disabled: v => wFull && !S.weapons.includes(v) })),
      S.weapons.length === 2 ? h('div', { class: 'top-actions' }, h('button', { class: 'btn', type: 'button', on: { click: () => set({ weapons: [S.weapons[1], S.weapons[0]] }) } }, `Hold ${S.weapons[1]} instead`)) : null,
      h('div', { class: 'field' },
        h('div', { class: 'label' }, h('span', {}, 'Magical items'), h('span', { class: 'counter' }, `${S.items.length} / 3`)),
        chooser(MAGIC_ITEMS.map(([n, d]) => [n, n, d]), v => S.items.includes(v), toggle('items', 3), { small: true, disabled: v => iFull && !S.items.includes(v) })),
    ];
  },
  pet() {
    return [
      h('h2', {}, 'Companion'),
      h('p', { class: 'lead' }, 'A pet or animal friend follows you through every sector.'),
      field('Companion', chooser(PETS.map(([n, d]) => [n, n, d]), v => v === S.pet, v => set({ pet: v }))),
      S.pet !== 'None' ? field('Companion name', h('input', { type: 'text', id: 'petName', maxlength: 16, value: S.petName, on: { input: e => set({ petName: e.target.value }, false) } })) : null,
    ];
  },
  review() {
    const st = stats(), img = h('img', { src: cv.toDataURL(), alt: 'Your avatar' });
    const o = S.outfit;
    const wear = [o.headwear, o.top, o.outer, o.bottoms, o.shoes, o.gloves, o.accessory].filter(x => x !== 'None').join(', ');
    const rows = [
      ['Race', race().name], ['Class', `${cls().name} · ${S.sub}`], ['Powers', S.powers.join(' + ') || 'None chosen'],
      ['Speed', `${S.speed}/10 · ${speedMs()} m/s`], ['Age', ageLabel()], ['Height', heightLabel(S.height)], ['Weight', weightLabel(S.weight)],
      ['Skin', SKIN_NAMES[S.skin]], ['Eyes', `${EYE_NAMES[S.eyeColor]}, ${S.eyeShape.toLowerCase()}`], ['Hair', `${HAIR_NAMES[S.hairColor]} ${S.hairStyle.toLowerCase()}`],
      ['Wearing', wear], ['Weapons', S.weapons.join(', ') || 'Unarmed'], ['Magic items', S.items.join(', ') || 'None'], ['Companion', S.pet === 'None' ? 'None' : `${S.petName || 'Unnamed'} the ${S.pet}`],
      ['Stats', Object.entries(st).map(([k, v]) => `${k} ${v}`).join(' · ')],
    ];
    const sheet = `OASIS AVATAR · ID ${oasisId()}\nName: ${S.name}\n` + rows.map(([k, v]) => `${k}: ${v}`).join('\n') + `\nLevel 1 · Coins 0 · Keys: none yet`;
    const ready = S.powers.length === 2 && S.name.trim();
    return [
      h('h2', {}, 'Avatar ID card'),
      h('div', { class: 'idcard' }, img,
        h('div', {}, h('h3', {}, S.name), h('div', { class: 'rig-id' }, `OASIS ID ${oasisId()} · LVL 1 · 0 coins`),
          h('dl', { class: 'kv' }, rows.flatMap(([k, v]) => [h('dt', {}, k), h('dd', {}, v)])),
          h('div', { class: 'keys' }, h('span', {}, 'Copper key'), h('span', {}, 'Jade key'), h('span', {}, 'Crystal key')))),
      !ready ? h('p', { class: 'note warn' }, 'Pick two powers before you log in.') : null,
      field('Character sheet', h('textarea', { id: 'sheet', readonly: true }, sheet)),
      h('div', { class: 'top-actions' },
        h('button', { class: 'btn primary', type: 'button', disabled: !ready, on: { click: () => toast(`${S.name} is ready to log in. Saved in this browser.`) } }, 'Log in to the OASIS'),
        h('button', { class: 'btn', type: 'button', on: { click: () => copy(sheet) } }, 'Copy character sheet')),
    ];
  },
};
const ageLabel = () => `${S.age} yrs`;
const speedLabel = () => `${S.speed}/10 · ${speedMs()} m/s`;

function renderTabs() {
  $('tabs').replaceChildren(...TABS.map(([id, label], i) =>
    h('button', { class: 'tab', role: 'tab', type: 'button', 'aria-selected': String(S.tab === id), on: { click: () => { S.tab = id; save(); renderTabs(); renderPane(); } } },
      h('span', { class: 'n' }, String(i + 1).padStart(2, '0')), label)));
}
function renderPane() {
  const i = TABS.findIndex(t => t[0] === S.tab);
  const nav = h('div', { class: 'pane-nav' },
    i > 0 ? h('button', { class: 'btn', type: 'button', on: { click: () => go(i - 1) } }, '← ' + TABS[i - 1][1]) : h('span'),
    i < TABS.length - 1 ? h('button', { class: 'btn primary', type: 'button', on: { click: () => go(i + 1) } }, TABS[i + 1][1] + ' →') : h('span'));
  $('pane').replaceChildren(...PANES[S.tab]().filter(Boolean), nav);
}
function go(i) { S.tab = TABS[i][0]; save(); renderTabs(); renderPane(); $('tabs').children[i].scrollIntoView({ block: 'nearest', inline: 'nearest' }); }

function updateRig() {
  $('rig-name').textContent = S.name || 'Unnamed';
  $('rig-id').textContent = `ID ${oasisId()}`;
  $('rig-sub').textContent = `${race().name} ${cls().name} · ${S.sub} · ${S.age} yrs`;
  $('rig-chips').replaceChildren(...S.powers.map(p => h('span', { class: 'chip power' }, p)),
    ...S.weapons.map(w => h('span', { class: 'chip' }, w)),
    ...S.items.map(w => h('span', { class: 'chip item' }, w)),
    ...(S.pet !== 'None' ? [h('span', { class: 'chip' }, `${S.petName || 'Pet'} · ${S.pet}`)] : []));
  const st = stats();
  $('rig-stats').replaceChildren(...Object.entries(st).flatMap(([k, v]) => [
    h('span', { class: 'lbl' }, k), h('div', { class: 'bar' }, h('i', { style: `width:${v / 15 * 100}%` })), h('span', { class: 'num' }, String(v))]));
  $('rig-vitals').replaceChildren(
    h('span', {}, 'HP ', h('b', {}, String(50 + st.VIT * 10))),
    h('span', {}, 'MANA ', h('b', {}, String(30 + st.INT * 8))),
    h('span', {}, 'SPD ', h('b', {}, speedMs() + ' m/s')));
  if (S.tab === 'review') { const img = document.querySelector('.idcard img'); if (img) img.src = cv.toDataURL(); }
  renderTabs();
}

function randomize() {
  const pick = a => a[Math.floor(Math.random() * a.length)];
  const c = pick(CLASSES);
  const shuffled = POWERS.map(p => p[0]).sort(() => Math.random() - 0.5);
  const names = ['Art3mis', 'Aech', 'Daito', 'Shoto', 'Nova', 'Pixel', 'Glitch', 'Rook', 'Kaiju', 'Vex', 'Byte', 'Zephyr', 'Halcyon', 'Echo'];
  const outfit = {}; for (const k in OUTFIT) outfit[k] = pick(OUTFIT[k].items);
  const r = pick(RACES).id;
  Object.assign(S, {
    name: pick(names), age: 16 + Math.floor(Math.random() * (r === 'elf' ? 250 : 50)), race: r, cls: c.id, sub: pick(c.subs)[0],
    powers: shuffled.slice(0, 2), speed: 1 + Math.floor(Math.random() * 10),
    height: r === 'dwarf' || r === 'halfling' || r === 'gnome' ? 105 + Math.floor(Math.random() * 30) : 150 + Math.floor(Math.random() * 55),
    weight: 45 + Math.floor(Math.random() * 70), skin: Math.floor(Math.random() * SKIN.length),
    hairStyle: pick(HAIR_STYLES), hairColor: Math.floor(Math.random() * HAIR_COLORS.length),
    eyeColor: Math.floor(Math.random() * EYE_COLORS.length), eyeShape: pick(EYE_SHAPES)[0], outfit,
    topColor: Math.floor(Math.random() * CLOTH_COLORS.length), outerColor: Math.floor(Math.random() * CLOTH_COLORS.length), bottomColor: Math.floor(Math.random() * CLOTH_COLORS.length),
    weapons: WEAPONS.map(w => w[0]).sort(() => Math.random() - 0.5).slice(0, 1 + Math.floor(Math.random() * 2)),
    items: MAGIC_ITEMS.map(w => w[0]).sort(() => Math.random() - 0.5).slice(0, 1 + Math.floor(Math.random() * 3)),
    pet: pick(PETS)[0], petName: pick(['Max', 'Bit', 'Sprocket', 'Nugget', 'Ziggy', 'Luna', 'Mochi']),
  });
  save(); updateRig(); renderPane();
}

function toast(msg) { const t = $('toast'); t.textContent = msg; t.hidden = false; clearTimeout(toast.t); toast.t = setTimeout(() => t.hidden = true, 2600); }
function copy(text) {
  const done = () => toast('Character sheet copied');
  try { navigator.clipboard.writeText(text).then(done, () => { $('sheet').select(); toast('Press Ctrl/Cmd+C to copy'); }); }
  catch (e) { $('sheet').select(); toast('Press Ctrl/Cmd+C to copy'); }
}

function start(seed) {
  load(seed);
  $('randomize').addEventListener('click', randomize);
  $('reset').addEventListener('click', () => { S = structuredClone(DEFAULT); save(); updateRig(); renderPane(); toast('Started over'); });
  updateRig(); renderPane();
  cancelAnimationFrame(raf); raf = requestAnimationFrame(loop);
  window.claude?.hot?.snapshot?.(() => S);
}
window.claude?.hot?.ready ? window.claude.hot.ready(start) : start(window.claude?.hot?.data ?? {});
})();
</script>
